   comments: |
      Using a 1600-ton, TL16 hull, the Ollu-class Frigate mounts jump drive-Z, maneuver drive-Z, and power plant-Z, giving a performance of jump-3 and 3G acceleration. Fuel tankage supports a 3 parsec jump, at 121t per parsec, and 2 months of operations. Attached to the bridge is a Computer Model/5 fib. There are 4 officer staterooms, 24 crew staterooms, a company barracks, and no low berths. Installed weaponry include 1 M Meson Gun, 1 Bay Missile, 1 Bay Particle Accelerator, 1 Bay DataCaster, 1 Bay Jump Damper, 8 B2 Sandcasters, and 8 B2 Pulse Lasers. Cargo capacity is 20 tons. The ship has a streamlined hull, with scoops for frontier refueling. 
      
      Carried craft include 5 Gigs in hull niches. The ship has 28 crew and 60 troops. 
