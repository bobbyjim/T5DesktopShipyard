      Planetoid Trader (A-HP11) Zebec. Using a 800-ton, TL16 hull, the Zebec mounts jump drive-D, maneuver drive-D, and power plant-D, giving a performance of jump-1 and 1G acceleration. Fuel tankage supports a 2 parsec jump, at 72t per parsec, and 3 months of operations. A Collector-1 enables jumping through rifts, or otherwise bypassing undesirable systems for refueling. 
      
