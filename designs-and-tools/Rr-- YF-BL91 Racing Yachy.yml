   comments: |
      A Type Y is an expensive toy. Using a 200-ton, TL16 hull, this Racing Yacht mounts jump drive-A, advanced maneuver drive-H, and power plant-J, giving a performance of jump-1 and 9G acceleration. Fuel tankage supports a 1 parsec jump, at 15t per parsec, and one month of operations. Attached to the bridge is a Computer Model/8. Its world- and space-sensor suites are impressive and long-ranged. There is a clinic, four crew staterooms, eight luxury passenger staterooms, two double passenger staterooms, and no low berths. There are two empty single turrets installed. Cargo capacity is 10 tons. The ship has a lift body hull, with scoops for frontier refueling. The hull is balanced for floating, and is capable of submersible activities.
      
      A streamlined bracket can carry a small craft (not included) of up to 10 tons. The yacht requires a Pilot-2, Astrogator-2, Engineer-2, and Medic. Two gunners would typically also be aboard if the ship mounts weaponry. However, it usually only has a crew of two: a pilot/engineer and a medic. The pilot/engineer usually doesn’t have anything to do except perhaps amuse the nobles on board. The ship’s computer is capable of taking on up to eight crew positions simultaneously. However, a “living” medic is typically preferred over the AI medical personality, and a human pilot is there for planning and troubleshooting. 
      
