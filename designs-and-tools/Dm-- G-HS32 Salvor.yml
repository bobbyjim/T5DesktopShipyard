   qsp: 'G-HS32'
   preMult: 1
   tons: 800
   comments: |
      Frigate (G-HS32). Using a 800-ton, TL12 hull, the Salvor Class Frigate mounts jump drive-H, maneuver drive-R, and power plant-R, giving a performance of jump-2 and 3G acceleration. Fuel tankage supports a 2 parsec jump, at 72t per parsec, and 3 months of operations. An aftermarket Collector-1 allows an extra one-parsec jump per charge. Attached to the bridge is a Computer Model/3. There is one captain's stateroom, two double staterooms, one triple stateroom, a gunner's barracks, and 16 low berths. Installed weaponry include 1 T3 Missile, 1 T3 Particle Accelerator, 1 T3 Pulse Laser, and 1 T3 Sandcaster. This particular ship also carries an aftermarket Black Globe, manufactured in the Republic of Regina. Cargo capacity is 290 tons. The ship has a streamlined hull. It costs MCr 265.
      
      There is one carried craft: a 20t Gig in a hull niche. The ship has 12 crew, and can carry 16 low passengers.
