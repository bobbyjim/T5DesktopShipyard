      Using a 200-ton hull, the Beowulf-class free trader is an elementary interstellar merchant ship plying the space lanes carrying cargo and passengers. It has jump drive-A, maneuver drive-A, and power plant-A, giving performance of jump-1 and 1-G acceleration. Fuel tankage supports the jump drive and one jump-1. Adjacent to the bridge is a computer Model/1. There are ten staterooms and twenty low berths. There are two hardpoints; the Beowulf has two hybrid triple turrets installed. There are no ship's vehicles. Cargo capacity is 82 tons. The hull is streamlined.
      
      The free trader typically requires a crew of four: pilot, engineer, medic, and steward. Up to two gunners may be added. The ship can carry six high or middle passengers and twenty low passengers.
