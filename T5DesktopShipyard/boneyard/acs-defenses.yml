   - { code: Im, label: Improved,     tl: 1,  qrebs: 1,  mod: 0,  oc: 110, tons: 0, cost mult: 0.5, av: -5  }
   - { code: St, label: Standard,     tl: 0,  grebes: 0,  mod: 0,  oc: 100, tons: 0, cost mult: 1, av: -6  }
